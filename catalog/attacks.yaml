# =============================================================================
# Attack catalog for the contained 5G incident-response lab
# =============================================================================
# Every attack here is SIMULATED: sim/inject.py edits the in-memory state of
# sim/engine.py.  Nothing in this file or the lab reaches a real network.
#
# Shape of one entry (signalling_storm_amf is the fully commented reference):
#   id, name, description, affected_nf
#   enisa_ref / threegpp_ref   where the threat and the control are described
#                              (file, page in the knowledge base)
#   policy_tags                Indian obligations shown in the Policy panel
#     categories               KB categories searched for related passages
#     query                    the similarity query for those passages
#     obligations              id, summary, applies_when, doc, phrase — the
#                              phrase is looked up verbatim in `doc` in the
#                              index; if it is not found the panel says so
#   retrieval_categories       KB categories the agent's search_kb may use
#   resolved_when              diagnostic checks that ALL must pass; the lab,
#                              not the agent, decides "resolved"
#   playbook.basic             5-10 most common steps.  Read-only diagnostics
#                              run freely; a state-changing step runs in Basic
#                              only if it is `auto_safe: true` (safe and
#                              idempotent).
#   playbook.intermediate /    every state-changing step needs the operator's
#   playbook.advanced          explicit yes (agent mode) or is run by the
#                              operator (manual mode)
#   step fields: id, description, action {fn, args}, is_state_changing,
#                [auto_safe], [success_check {fn, args, path, op, value}],
#                [source] (where the step comes from)
#   An argument can come from a live finding instead of a fixed value:
#     source: {from: {fn: get_top_talkers, args: {nf: amf}, path: top.0.source}}
#
# Validated by catalog/loader.py (python -c "from catalog.loader import load_catalog; load_catalog()").
# =============================================================================

# Obligations reused by several attacks (YAML anchors).  Each phrase was
# checked against the PDF text; the Policy panel re-checks it in the index.
obligation_library:
  - &certin_6h
    id: certin_6h
    summary: Report the cyber incident to CERT-In within 6 hours of noticing it
    applies_when: the incident is of a type listed in Annexure I of the CERT-In Directions (e.g. targeted scanning, compromise of critical systems, attacks on servers, DoS/DDoS, data breach, unauthorised access)
    doc: CERT-In_Directions_70B_28.04.2022.pdf
    phrase: within 6 hours of noticing such incidents
  - &certin_logs
    id: certin_logs_180d
    summary: Keep ICT system logs for a rolling 180 days and provide them to CERT-In on request
    applies_when: always (preserve the incident's logs; do not let them roll over)
    doc: CERT-In_Directions_70B_28.04.2022.pdf
    phrase: rolling period of 180 days
  - &tcs_rule7
    id: tcs_rules_rule7_6h
    summary: Telecommunication entity reports the security incident to the Central Government within six hours of becoming aware (Telecom Cyber Security Rules, 2024, rule 7), followed by the details the rules require
    applies_when: the incident affects the telecommunication network or service
    doc: cybersecurity-rules-2024.pdf
    phrase: within six hours of becoming aware of a security incident
  - &cti_rules
    id: cti_rules_reporting
    summary: If the affected network is notified as Critical Telecommunication Infrastructure, follow the CTI Rules, 2024 incident-reporting timelines
    applies_when: the affected network or element is notified as Critical Telecommunication Infrastructure
    doc: Critical Telecommunication Infrastructure Rules, 2024_0.pdf
    phrase: reporting of security incidents
  - &telecom_act_s22
    id: telecom_act_s22
    summary: Telecommunications Act, 2023 s.22 — measures to protect and ensure the cyber security of telecommunication networks and services
    applies_when: always (statutory basis of the Telecom Cyber Security Rules)
    doc: new-telecom-Act-2023.pdf
    phrase: protect and ensure cyber security of telecommunication networks
  - &dpdp_s8_6
    id: dpdp_act_s8_6
    summary: DPDP Act, 2023 s.8(6) — on a personal data breach, intimate the Data Protection Board and each affected Data Principal
    applies_when: subscribers' personal data was (or may have been) accessed or disclosed; NOTE s.8 commences 18 months after 13 Nov 2025 (G.S.R. 843(E)) — plan for it now, verify the commencement date before relying on it
    doc: 2bf1f0e9f04e6fb4f8fef35e82c42aa5.pdf
    phrase: In the event of a personal data breach
  - &dpdp_rule7
    id: dpdp_rules_rule7_72h
    summary: DPDP Rules, 2025 rule 7 — detailed intimation to the Board within seventy-two hours of becoming aware of the breach
    applies_when: personal data breach; NOTE rule 7 commences eighteen months after publication of the Rules (Nov 2025) — verify before relying on it
    doc: 53450e6e5dc0bfa85ebd78686cadad39.pdf
    phrase: within seventy-two hours of becoming aware of the breach
  - &dpdp_commencement
    id: dpdp_commencement
    summary: Commencement notification G.S.R. 843(E), 13 Nov 2025 — the breach-intimation provisions (ss. 3-17 incl. s.8) come into force eighteen months after publication
    applies_when: deciding whether the DPDP breach duties already apply on the incident date
    doc: c56ceae6c383460ca69577428d36828b.pdf
    phrase: eighteen months from the date of publication

attacks:

  # ---------------------------------------------------------------------------
  # REFERENCE ENTRY — every field used, every step commented
  # ---------------------------------------------------------------------------
  - id: signalling_storm_amf
    name: Signalling storm (registration flood)
    description: >-
      Hundreds of devices try to register at once and the AMF, the core's
      front desk, is overwhelmed: CPU above 90%, N1/N2 queues full, and
      legitimate devices' registrations are rejected. All of it comes through
      one base station that is not in the cell inventory, from one block of
      subscriber IDs. Difficulty: easy (loud, one source, obvious cause).
    affected_nf: [amf, gnb]
    enisa_ref: >-
      ENISA Threat Landscape for 5G Networks (Update), threat "Signalling
      storms" (ENISA 5G Threat Landscape - Update.pdf, p. 107) and "Flooding of
      core network components" (p. 104)
    threegpp_ref: >-
      3GPP TS 23.501 clause 5.19 Control Plane Load Control, Congestion and
      Overload Control and 5.19.5 AMF Control Of Overload
      (ts_123501v190800p.pdf, pp. 359-360)
    policy_tags:
      categories: [cyber_incident_rules, law_and_acts]
      query: report a security incident affecting the telecommunication network, denial of service
      obligations: [*certin_6h, *tcs_rule7, *cti_rules, *certin_logs, *telecom_act_s22]
    retrieval_categories: [gpp_architecture, gpp_security, threat_frameworks, cyber_incident_rules]
    # Resolved = the unauthorised base station is off the AMF, the storm range
    # is blocked, and LEGITIMATE registrations recover (failure rate < 2%).
    resolved_when:
      - {fn: list_gnbs, path: unauthorised_connected, op: empty}
      - {fn: get_top_talkers, args: {nf: amf}, path: top.0.blocked, op: "==", value: true}
      - {fn: get_metrics, args: {nf: amf}, path: registration_failure_pct, op: "<", value: 2}
      - {fn: get_nf_health, args: {nf: amf}, path: amf, op: "==", value: ok}
    playbook:
      basic:
        - id: b1_alerts
          description: Read the active alerts to confirm what the monitoring saw
          action: {fn: get_alerts, args: {}}
          is_state_changing: false
        - id: b2_health
          description: Check AMF health (ok / degraded / down)
          action: {fn: get_nf_health, args: {nf: amf}}
          is_state_changing: false
        - id: b3_metrics
          description: Read AMF CPU, registration rate and registration failure rate
          action: {fn: get_metrics, args: {nf: amf}}
          is_state_changing: false
        - id: b4_logs
          description: Read recent AMF logs for the registration pattern (repeated SUCI, no service request)
          action: {fn: get_logs, args: {nf: amf, last: 10}}
          is_state_changing: false
        - id: b5_gnbs
          description: List base stations on the AMF; find any not in the cell inventory
          action: {fn: list_gnbs, args: {}}
          is_state_changing: false
        - id: b6_top_talkers
          description: Identify the subscriber range and the base station it comes through
          action: {fn: get_top_talkers, args: {nf: amf}}
          is_state_changing: false
        - id: b7_disconnect_gnb
          description: Disconnect the base station that is not in the cell inventory (safe - it is not ours; idempotent)
          action: {fn: disconnect_gnb, args: {gnb_id: {from: {fn: list_gnbs, path: unauthorised_connected.0}}}}
          is_state_changing: true
          auto_safe: true
          success_check: {fn: list_gnbs, path: unauthorised_connected, op: empty}
        - id: b8_block_range
          description: Block the subscriber range that generated the storm (safe - every request from it was storm traffic; idempotent)
          action: {fn: block_source, args: {nf: amf, source: {from: {fn: get_top_talkers, args: {nf: amf}, path: top.0.source}}}}
          is_state_changing: true
          auto_safe: true
          success_check: {fn: get_top_talkers, args: {nf: amf}, path: top.0.blocked, op: "==", value: true}
        - id: b9_verify
          description: Confirm legitimate registrations recover (failure rate below 2%)
          action: {fn: get_metrics, args: {nf: amf}}
          is_state_changing: false
          success_check: {fn: get_metrics, args: {nf: amf}, path: registration_failure_pct, op: "<", value: 2}
      intermediate:
        - id: i1_rate_limit
          description: Cap accepted registrations at 1500/min as overload protection against a repeat (AMF overload control)
          action: {fn: rate_limit_nf, args: {nf: amf, limit: 1500}}
          is_state_changing: true
          source: TS 23.501 5.19.5 AMF Control Of Overload (ts_123501v190800p.pdf, p. 360)
        - id: i2_scale_out
          description: Add a second AMF instance for headroom
          action: {fn: scale_out, args: {nf: amf, replicas: 2}}
          is_state_changing: true
        - id: i3_verify
          description: Re-check AMF metrics
          action: {fn: get_metrics, args: {nf: amf}}
          is_state_changing: false
      advanced:
        - id: a1_restart_amf
          description: Restart the AMF with clean runtime state (drops in-flight registrations)
          action: {fn: reset_nf, args: {nf: amf}}
          is_state_changing: true
        - id: a2_reapply_limit
          description: Re-apply the registration rate limit after the restart
          action: {fn: rate_limit_nf, args: {nf: amf, limit: 1500}}
          is_state_changing: true
        - id: a3_verify
          description: Final AMF health check
          action: {fn: get_nf_health, args: {nf: amf}}
          is_state_changing: false

  # ---------------------------------------------------------------------------
  - id: core_ddos_upf
    name: Volumetric DDoS on the UPF (N6)
    description: >-
      Three data-network hosts send far more traffic than the UPF can carry;
      GTP-U buffers fill and packets are dropped for every slice.
    affected_nf: [upf]
    enisa_ref: >-
      ENISA 5G Threat Landscape (Update), "Distributed denial of service
      (DDoS)" and "Flooding of core network components" (ENISA 5G Threat
      Landscape - Update.pdf, p. 104)
    threegpp_ref: >-
      3GPP TS 33.501 clause 9.3 security of the N3 interface
      (ts_133501v181200p.pdf, p. 159); user-plane overload handled by
      operator traffic management (TS 23.501 5.19, ts_123501v190800p.pdf, p. 359)
    policy_tags:
      categories: [cyber_incident_rules, law_and_acts]
      query: denial of service attack on telecommunication network incident reporting
      obligations: [*certin_6h, *tcs_rule7, *cti_rules, *certin_logs]
    retrieval_categories: [gpp_architecture, gpp_security, threat_frameworks, cyber_incident_rules]
    resolved_when:
      - {fn: get_metrics, args: {nf: upf}, path: packet_drop_pct, op: "<", value: 5}
      - {fn: get_nf_health, args: {nf: upf}, path: upf, op: "==", value: ok}
    playbook:
      basic:
        - {id: b1_alerts, description: Read the active alerts, action: {fn: get_alerts, args: {}}, is_state_changing: false}
        - {id: b2_health, description: Check UPF health, action: {fn: get_nf_health, args: {nf: upf}}, is_state_changing: false}
        - {id: b3_metrics, description: Read UPF offered/accepted rate and packet drop, action: {fn: get_metrics, args: {nf: upf}}, is_state_changing: false}
        - {id: b4_logs, description: Read recent UPF logs, action: {fn: get_logs, args: {nf: upf, last: 10}}, is_state_changing: false}
        - {id: b5_top_talkers, description: Identify the N6 sources of the flood, action: {fn: get_top_talkers, args: {nf: upf}}, is_state_changing: false}
        - id: b6_rate_limit
          description: Police UPF ingress at 3000 units (safe, idempotent)
          action: {fn: rate_limit_nf, args: {nf: upf, limit: 3000}}
          is_state_changing: true
          auto_safe: true
        - id: b7_scale_out
          description: Add a second UPF instance (safe, idempotent)
          action: {fn: scale_out, args: {nf: upf, replicas: 2}}
          is_state_changing: true
          auto_safe: true
          success_check: {fn: get_metrics, args: {nf: upf}, path: packet_drop_pct, op: "<", value: 5}
      intermediate:
        - {id: i1_block_1, description: Block the largest flood source, action: {fn: block_source, args: {nf: upf, source: {from: {fn: get_top_talkers, args: {nf: upf}, path: top.0.source}}}}, is_state_changing: true}
        - {id: i2_block_2, description: Block the second flood source, action: {fn: block_source, args: {nf: upf, source: {from: {fn: get_top_talkers, args: {nf: upf}, path: top.1.source}}}}, is_state_changing: true}
        - {id: i3_block_3, description: Block the third flood source, action: {fn: block_source, args: {nf: upf, source: {from: {fn: get_top_talkers, args: {nf: upf}, path: top.2.source}}}}, is_state_changing: true}
      advanced:
        - {id: a1_upstream_scrubbing, description: Mark N6 for upstream scrubbing by the transit provider, action: {fn: patch_config, args: {nf: upf, key: n6_upstream_scrubbing, value: enabled}}, is_state_changing: true}
        - {id: a2_restart_upf, description: Restart the UPF with clean runtime state, action: {fn: reset_nf, args: {nf: upf}}, is_state_changing: true}
        - {id: a3_verify, description: Final UPF metrics, action: {fn: get_metrics, args: {nf: upf}}, is_state_changing: false}

  # ---------------------------------------------------------------------------
  - id: rogue_base_station
    name: Fake base station (rogue cell)
    description: >-
      A fake cell stronger than the real ones appears in TA-4501. Nearby phones
      report a cell id that is not in the cell inventory, and clusters of
      devices drop off or fall back to LTE (denial of service and downgrade;
      5G's SUCI still hides the permanent identity). Difficulty: medium - the
      evidence is statistical rather than one obvious log line.
    affected_nf: [gnb]
    enisa_ref: >-
      ENISA 5G Threat Landscape (Update), "Man in the middle / Session
      hijacking — Session hijacking via rogue base station — Downgrade attacks
      via rogue base station" (ENISA 5G Threat Landscape - Update.pdf, p. 108)
    threegpp_ref: >-
      3GPP TS 33.501 Annex E "UE-assisted network-based detection of false base
      station" (ts_133501v181200p.pdf, pp. 250-251) and clause 6.12.2 SUCI
      (p. 114). (3GPP TR 33.809, the false-base-station study, is not in the
      knowledge base.)
    policy_tags:
      categories: [cyber_incident_rules, law_and_acts]
      query: interference with telecommunication network false base station security incident
      obligations: [*certin_6h, *tcs_rule7, *certin_logs, *telecom_act_s22]
    retrieval_categories: [gpp_security, threat_frameworks, cyber_incident_rules]
    resolved_when:
      - {fn: get_ran_kpis, path: fallback_to_lte_ues, op: "==", value: 0}
      - {fn: get_ran_kpis, path: hostile_cells, op: contains, value: gnb-666}
      - {fn: get_ran_kpis, path: field_ticket_cells, op: contains, value: gnb-666}
      - {fn: list_neighbors, path: whitelist, op: "==", value: enforced}
    playbook:
      basic:
        - {id: b1_alerts, description: Read the active alerts, action: {fn: get_alerts, args: {}}, is_state_changing: false}
        - {id: b2_ran_kpis, description: Read RAN KPIs - unknown cells in measurement reports, LTE fallbacks, link failures, action: {fn: get_ran_kpis, args: {}}, is_state_changing: false}
        - {id: b3_neighbors, description: Compare reported cells with the planned neighbour list, action: {fn: list_neighbors, args: {}}, is_state_changing: false}
        - {id: b4_gnb_logs, description: Read gNB logs (measurement reports), action: {fn: get_logs, args: {nf: gnb, last: 10}}, is_state_changing: false}
        - {id: b5_amf_logs, description: Read AMF logs (downgraded registrations), action: {fn: get_logs, args: {nf: amf, last: 10}}, is_state_changing: false}
        - {id: b6_auth, description: Confirm SUCI protection is still on (identity not exposed), action: {fn: check_auth_config, args: {}}, is_state_changing: false}
        - id: b7_whitelist
          description: Re-enable the planned-neighbour whitelist (restores the baseline control; safe, idempotent)
          action: {fn: patch_config, args: {nf: gnb, key: neighbor_whitelist, value: enforced}}
          is_state_changing: true
          auto_safe: true
          success_check: {fn: list_neighbors, path: whitelist, op: "==", value: enforced}
      intermediate:
        - id: i1_flag_hostile
          description: Flag the cell that is not in the inventory as hostile
          action: {fn: flag_cell_hostile, args: {cell_id: {from: {fn: get_ran_kpis, path: unknown_cells_reported.0.cell}}}}
          is_state_changing: true
          success_check: {fn: get_ran_kpis, path: hostile_cells, op: contains, value: gnb-666}
        - id: i2_device_policy
          description: Push a policy telling devices in TA-4501 to ignore that cell
          action: {fn: push_device_policy, args: {cell_id: {from: {fn: get_ran_kpis, path: unknown_cells_reported.0.cell}}}}
          is_state_changing: true
          success_check: {fn: get_ran_kpis, path: fallback_to_lte_ues, op: "==", value: 0}
        - id: i3_field_team
          description: Hand off to a field team to locate the transmitter (physical removal is a real-world action; recorded here)
          action: {fn: dispatch_field_team, args: {cell_id: {from: {fn: get_ran_kpis, path: unknown_cells_reported.0.cell}}}}
          is_state_changing: true
          source: TS 33.501 Annex E (ts_133501v181200p.pdf, pp. 250-251)
        - {id: i4_verify, description: Re-read RAN KPIs, action: {fn: get_ran_kpis, args: {}}, is_state_changing: false}
      advanced:
        - {id: a1_fbs_detection, description: Turn on continuous UE-assisted false-base-station detection, action: {fn: patch_config, args: {nf: gnb, key: fbs_detection, value: enabled}}, is_state_changing: true}
        - {id: a2_verify, description: Final RAN KPI check, action: {fn: get_ran_kpis, args: {}}, is_state_changing: false}

  # ---------------------------------------------------------------------------
  - id: subscriber_cred_compromise
    name: Subscriber credential compromise (cloned SIM)
    description: >-
      One SUPI authenticates from two tracking areas 900 km apart within
      minutes and from three devices — the subscriber's long-term key is
      likely cloned.
    affected_nf: [ausf, udm]
    enisa_ref: >-
      ENISA 5G Threat Landscape (Update), "Abuse of authentication" (p. 105)
      and "Identity theft" (p. 106) (ENISA 5G Threat Landscape - Update.pdf)
    threegpp_ref: >-
      3GPP TS 33.501 clause 6.1.3.2 Authentication procedure for 5G AKA
      (ts_133501v181200p.pdf, p. 53)
    policy_tags:
      categories: [cyber_incident_rules, data_protection, law_and_acts]
      query: unauthorised access to subscriber credentials personal data breach
      obligations: [*certin_6h, *tcs_rule7, *certin_logs, *dpdp_s8_6, *dpdp_rule7, *dpdp_commencement]
    retrieval_categories: [gpp_security, threat_frameworks, data_protection, cyber_incident_rules]
    resolved_when:
      - {fn: check_auth_config, path: subscriber_keys_compromised, op: "==", value: false}
    playbook:
      basic:
        - {id: b1_alerts, description: Read the active alerts, action: {fn: get_alerts, args: {}}, is_state_changing: false}
        - {id: b2_ausf_logs, description: Read AUSF authentication logs, action: {fn: get_logs, args: {nf: ausf, last: 10}}, is_state_changing: false}
        - {id: b3_auth, description: Check the authentication method and key version, action: {fn: check_auth_config, args: {}}, is_state_changing: false}
        - {id: b4_health, description: Check core NF health, action: {fn: get_nf_health, args: {}}, is_state_changing: false}
        - {id: b5_amf_logs, description: Read AMF logs for the same SUPI, action: {fn: get_logs, args: {nf: amf, last: 10}}, is_state_changing: false}
      intermediate:
        - id: i1_concurrent_auth_guard
          description: Enable the AUSF concurrent-authentication guard (reject a SUPI already attached elsewhere)
          action: {fn: patch_config, args: {nf: ausf, key: concurrent_auth_guard, value: enabled}}
          is_state_changing: true
        - id: i2_rotate_nf_certs
          description: Rotate NF certificates in case the key material leaked from the core
          action: {fn: rotate_keys, args: {scope: nf_certificates}}
          is_state_changing: true
        - {id: i3_verify, description: Re-check authentication state, action: {fn: check_auth_config, args: {}}, is_state_changing: false}
      advanced:
        - id: a1_rekey_subscriber
          description: Re-provision the subscriber's long-term key (new SIM / key version) — invalidates the clone
          action: {fn: rotate_keys, args: {scope: subscriber}}
          is_state_changing: true
          success_check: {fn: check_auth_config, path: subscriber_keys_compromised, op: "==", value: false}
          source: TS 33.501 6.1.3.2 5G AKA (ts_133501v181200p.pdf, p. 53)
        - {id: a2_verify, description: Final authentication check, action: {fn: check_auth_config, args: {}}, is_state_changing: false}

  # ---------------------------------------------------------------------------
  - id: sba_api_abuse_nef
    name: SBA API abuse through the NEF
    description: >-
      An unregistered application function calls the NEF event-exposure API
      4200 times per minute; OAuth2 on the NEF was relaxed to optional.
    affected_nf: [nef]
    enisa_ref: >-
      ENISA 5G Threat Landscape (Update), "Exploitation of software, hardware
      vulnerabilities — API exploitation" (p. 104) and "Improper API Access
      implementation" (p. 190) (ENISA 5G Threat Landscape - Update.pdf)
    threegpp_ref: >-
      3GPP TS 33.501 clause 13.4.1 OAuth 2.0 based authorization of NF
      service access (ts_133501v181200p.pdf, p. 194)
    policy_tags:
      categories: [cyber_incident_rules, law_and_acts]
      query: unauthorised access to network functions application programming interface incident
      obligations: [*certin_6h, *tcs_rule7, *certin_logs]
    retrieval_categories: [gpp_security, gpp_architecture, threat_frameworks, cyber_incident_rules]
    resolved_when:
      - {fn: check_api_access_log, args: {nf: nef}, path: oauth2, op: "==", value: required}
      - {fn: check_api_access_log, args: {nf: nef}, path: abusive_tokens, op: empty}
      - {fn: get_metrics, args: {nf: nef}, path: api_calls_per_min, op: "<", value: 200}
    playbook:
      basic:
        - {id: b1_alerts, description: Read the active alerts, action: {fn: get_alerts, args: {}}, is_state_changing: false}
        - {id: b2_access_log, description: Read the NEF API access log (OAuth2 mode, abusive tokens), action: {fn: check_api_access_log, args: {nf: nef}}, is_state_changing: false}
        - {id: b3_metrics, description: Read NEF call rate, action: {fn: get_metrics, args: {nf: nef}}, is_state_changing: false}
        - {id: b4_top_talkers, description: Identify the calling application functions, action: {fn: get_top_talkers, args: {nf: nef}}, is_state_changing: false}
        - {id: b5_logs, description: Read NEF logs, action: {fn: get_logs, args: {nf: nef, last: 10}}, is_state_changing: false}
        - id: b6_rate_limit
          description: Cap NEF API calls at 500/min (safe, idempotent)
          action: {fn: rate_limit_nf, args: {nf: nef, limit: 500}}
          is_state_changing: true
          auto_safe: true
      intermediate:
        - id: i1_revoke
          description: Revoke the tokens of the abusive application function
          action: {fn: revoke_tokens, args: {nf: nef}}
          is_state_changing: true
          success_check: {fn: check_api_access_log, args: {nf: nef}, path: abusive_tokens, op: empty}
        - id: i2_require_oauth
          description: Make OAuth2 mandatory again on the NEF
          action: {fn: patch_config, args: {nf: nef, key: oauth2, value: required}}
          is_state_changing: true
          source: TS 33.501 13.4.1 (ts_133501v181200p.pdf, p. 194)
        - {id: i3_verify, description: Re-read the API access log, action: {fn: check_api_access_log, args: {nf: nef}}, is_state_changing: false}
      advanced:
        - {id: a1_isolate, description: Detach the NEF from the mesh while the API gateway is reviewed, action: {fn: isolate_nf, args: {nf: nef}}, is_state_changing: true}
        - {id: a2_rotate_certs, description: Rotate NF certificates, action: {fn: rotate_keys, args: {scope: nf_certificates}}, is_state_changing: true}
        - {id: a3_restore, description: Re-attach the NEF, action: {fn: restore_nf, args: {nf: nef}}, is_state_changing: true}

  # ---------------------------------------------------------------------------
  - id: subscriber_data_exfiltration
    name: Subscriber data exfiltration from the UDM
    description: >-
      A consumer application reads tens of thousands of subscriber profiles
      (SUPI, MSISDN, location) through a bulk-export interface that should be
      disabled.
    affected_nf: [udm]
    enisa_ref: >-
      ENISA 5G Threat Landscape (Update), "Data breach, leak, theft and
      manipulation of information" (ENISA 5G Threat Landscape - Update.pdf, p. 106)
    threegpp_ref: >-
      3GPP TS 33.501 clause 5.9.2.1 requirements for service registration,
      discovery and authorization (ts_133501v181200p.pdf, p. 39) and 13.4.1
      OAuth 2.0 authorization (p. 194)
    policy_tags:
      categories: [data_protection, cyber_incident_rules, law_and_acts]
      query: personal data breach intimation to the Board and affected data principals
      obligations: [*certin_6h, *tcs_rule7, *dpdp_s8_6, *dpdp_rule7, *dpdp_commencement, *certin_logs]
    retrieval_categories: [gpp_security, threat_frameworks, data_protection, cyber_incident_rules]
    resolved_when:
      - {fn: get_metrics, args: {nf: udm}, path: bulk_reads_active, op: "==", value: 0}
      - {fn: check_api_access_log, args: {nf: udm}, path: bulk_export, op: "==", value: disabled}
    playbook:
      basic:
        - {id: b1_alerts, description: Read the active alerts, action: {fn: get_alerts, args: {}}, is_state_changing: false}
        - {id: b2_access_log, description: Read the UDM access log (bulk export, bulk readers), action: {fn: check_api_access_log, args: {nf: udm}}, is_state_changing: false}
        - {id: b3_metrics, description: Read UDM metrics (active bulk reads), action: {fn: get_metrics, args: {nf: udm}}, is_state_changing: false}
        - {id: b4_top_talkers, description: Identify the consumers reading the UDM, action: {fn: get_top_talkers, args: {nf: udm}}, is_state_changing: false}
        - {id: b5_logs, description: Read UDM logs (what data was read), action: {fn: get_logs, args: {nf: udm, last: 10}}, is_state_changing: false}
        - id: b6_disable_bulk
          description: Disable bulk export again (restores the baseline control; safe, idempotent)
          action: {fn: patch_config, args: {nf: udm, key: bulk_export, value: disabled}}
          is_state_changing: true
          auto_safe: true
      intermediate:
        - id: i1_revoke
          description: Revoke the access tokens of the bulk reader
          action: {fn: revoke_tokens, args: {nf: udm}}
          is_state_changing: true
          success_check: {fn: get_metrics, args: {nf: udm}, path: bulk_reads_active, op: "==", value: 0}
        - {id: i2_block, description: Block the reading consumer at the UDM, action: {fn: block_source, args: {nf: udm, source: {from: {fn: get_top_talkers, args: {nf: udm}, path: top.0.source}}}}, is_state_changing: true}
        - {id: i3_verify, description: Re-read the UDM access log, action: {fn: check_api_access_log, args: {nf: udm}}, is_state_changing: false}
      advanced:
        - {id: a1_rotate_certs, description: Rotate NF certificates used by consumers, action: {fn: rotate_keys, args: {scope: nf_certificates}}, is_state_changing: true}
        - {id: a2_isolate, description: Isolate the UDM for forensic review, action: {fn: isolate_nf, args: {nf: udm}}, is_state_changing: true}
        - {id: a3_restore, description: Re-attach the UDM after review, action: {fn: restore_nf, args: {nf: udm}}, is_state_changing: true}

  # ---------------------------------------------------------------------------
  - id: nf_host_ransomware
    name: Ransomware on an NF host (SMF)
    description: >-
      Files on the SMF host are encrypted and renamed *.locked; the SMF has
      crashed and new PDU sessions fail.
    affected_nf: [smf]
    enisa_ref: >-
      ENISA 5G Threat Landscape (Update), "Ransomware" and "Abuse of remote
      access to the network" (ENISA 5G Threat Landscape - Update.pdf, p. 105)
    threegpp_ref: >-
      3GPP TS 33.501 clause 5.9.2.1 NF service registration, discovery and
      authorization (ts_133501v181200p.pdf, p. 39) — the restored SMF must
      re-register with valid credentials
    policy_tags:
      categories: [cyber_incident_rules, law_and_acts]
      query: compromise of critical systems ransomware incident reporting
      obligations: [*certin_6h, *tcs_rule7, *cti_rules, *certin_logs, *telecom_act_s22]
    retrieval_categories: [gpp_security, threat_frameworks, cyber_incident_rules]
    resolved_when:
      - {fn: check_file_integrity, args: {nf: smf}, path: files_encrypted, op: "==", value: false}
      - {fn: get_nf_health, args: {nf: smf}, path: smf, op: "==", value: ok}
    playbook:
      basic:
        - {id: b1_alerts, description: Read the active alerts, action: {fn: get_alerts, args: {}}, is_state_changing: false}
        - {id: b2_health, description: Check health of all NFs for spread, action: {fn: get_nf_health, args: {}}, is_state_changing: false}
        - {id: b3_integrity, description: Check SMF file integrity and the last clean backup, action: {fn: check_file_integrity, args: {nf: smf}}, is_state_changing: false}
        - {id: b4_logs, description: Read SMF logs, action: {fn: get_logs, args: {nf: smf, last: 10}}, is_state_changing: false}
        - {id: b5_upf_integrity, description: Check the neighbouring UPF host for encryption, action: {fn: check_file_integrity, args: {nf: upf}}, is_state_changing: false}
        - id: b6_isolate
          description: Isolate the SMF host from the mesh to stop spread (it is already down; safe, idempotent)
          action: {fn: isolate_nf, args: {nf: smf}}
          is_state_changing: true
          auto_safe: true
          success_check: {fn: get_nf_health, args: {nf: smf}, path: smf, op: "!=", value: ok}
      intermediate:
        - id: i1_rotate_oam
          description: Rotate OAM credentials (likely entry point for the ransomware)
          action: {fn: rotate_keys, args: {scope: oam_credentials}}
          is_state_changing: true
        - {id: i2_mgmt_exposure, description: Check the management interface exposure, action: {fn: check_mgmt_exposure, args: {}}, is_state_changing: false}
        - {id: i3_rotate_certs, description: Rotate NF certificates, action: {fn: rotate_keys, args: {scope: nf_certificates}}, is_state_changing: true}
      advanced:
        - id: a1_restore_backup
          description: Rebuild the SMF from the last clean backup
          action: {fn: restore_from_backup, args: {nf: smf}}
          is_state_changing: true
          success_check: {fn: check_file_integrity, args: {nf: smf}, path: files_encrypted, op: "==", value: false}
        - id: a2_reattach
          description: Re-attach the restored SMF to the mesh
          action: {fn: restore_nf, args: {nf: smf}}
          is_state_changing: true
          success_check: {fn: get_nf_health, args: {nf: smf}, path: smf, op: "==", value: ok}
        - {id: a3_verify, description: Confirm PDU sessions are back, action: {fn: get_metrics, args: {}}, is_state_changing: false}

  # ---------------------------------------------------------------------------
  - id: exposed_mgmt_interface
    name: Management (OAM) interface exposed to the internet
    description: >-
      The OAM interface is reachable from outside the operator network and an
      external address logged in with the default admin account.
    affected_nf: [oam]
    enisa_ref: >-
      ENISA 5G Threat Landscape (Update), "Abuse of remote access to the
      network" (p. 105) and default accounts / weak passwords (p. 115)
      (ENISA 5G Threat Landscape - Update.pdf)
    threegpp_ref: >-
      3GPP TS 33.501 clause 5.9.2.1 authorization requirements
      (ts_133501v181200p.pdf, p. 39)
    policy_tags:
      categories: [cyber_incident_rules, law_and_acts]
      query: unauthorised access to systems default credentials incident reporting
      obligations: [*certin_6h, *tcs_rule7, *certin_logs, *telecom_act_s22]
    retrieval_categories: [gpp_security, threat_frameworks, cyber_incident_rules]
    resolved_when:
      - {fn: check_mgmt_exposure, path: exposed_to_internet, op: "==", value: false}
      - {fn: check_mgmt_exposure, path: default_credentials, op: "==", value: false}
    playbook:
      basic:
        - {id: b1_alerts, description: Read the active alerts, action: {fn: get_alerts, args: {}}, is_state_changing: false}
        - {id: b2_exposure, description: Check OAM exposure and credentials, action: {fn: check_mgmt_exposure, args: {}}, is_state_changing: false}
        - {id: b3_logs, description: Read OAM login logs, action: {fn: get_logs, args: {nf: oam, last: 10}}, is_state_changing: false}
        - {id: b4_health, description: Check NF health for signs of misuse, action: {fn: get_nf_health, args: {}}, is_state_changing: false}
        - id: b5_close
          description: Close the management interface to external networks (safe, idempotent)
          action: {fn: close_mgmt_interface, args: {}}
          is_state_changing: true
          auto_safe: true
          success_check: {fn: check_mgmt_exposure, path: exposed_to_internet, op: "==", value: false}
      intermediate:
        - id: i1_rotate_oam
          description: Replace the default admin credentials (rotate OAM credentials)
          action: {fn: rotate_keys, args: {scope: oam_credentials}}
          is_state_changing: true
          success_check: {fn: check_mgmt_exposure, path: default_credentials, op: "==", value: false}
        - {id: i2_verify, description: Re-check exposure, action: {fn: check_mgmt_exposure, args: {}}, is_state_changing: false}
      advanced:
        - {id: a1_rotate_certs, description: Rotate NF certificates the OAM could reach, action: {fn: rotate_keys, args: {scope: nf_certificates}}, is_state_changing: true}
        - {id: a2_integrity, description: Check AMF host integrity after the unauthorised login, action: {fn: check_file_integrity, args: {nf: amf}}, is_state_changing: false}

  # ---------------------------------------------------------------------------
  - id: n2_n3_mitm
    name: Man-in-the-middle on the N2/N3 backhaul
    description: >-
      After a transport-network change, N2 (control) and N3 (user plane) run
      without IPsec and user-plane integrity protection is off; GTP-U packets
      arrive via an unknown hop.
    affected_nf: [gnb, upf, amf]
    enisa_ref: >-
      ENISA 5G Threat Landscape (Update), "Man in the middle / Session
      hijacking" (ENISA 5G Threat Landscape - Update.pdf, p. 108)
    threegpp_ref: >-
      3GPP TS 33.501 clause 9.2 Security mechanisms for the N2 interface and
      9.3 for the N3 interface (ts_133501v181200p.pdf, p. 159)
    policy_tags:
      categories: [cyber_incident_rules, law_and_acts, data_protection]
      query: interception of communications on the network security incident
      obligations: [*certin_6h, *tcs_rule7, *cti_rules, *certin_logs, *dpdp_s8_6, *dpdp_commencement]
    retrieval_categories: [gpp_security, gpp_architecture, threat_frameworks, cyber_incident_rules]
    resolved_when:
      - {fn: check_interface_security, path: N2.ipsec, op: "==", value: true}
      - {fn: check_interface_security, path: N3.ipsec, op: "==", value: true}
      - {fn: check_auth_config, path: up_integrity, op: "==", value: required}
    playbook:
      basic:
        - {id: b1_alerts, description: Read the active alerts, action: {fn: get_alerts, args: {}}, is_state_changing: false}
        - {id: b2_interfaces, description: Check IPsec on N2 and N3, action: {fn: check_interface_security, args: {}}, is_state_changing: false}
        - {id: b3_auth, description: Check user-plane integrity setting, action: {fn: check_auth_config, args: {}}, is_state_changing: false}
        - {id: b4_gnb_logs, description: Read gNB logs, action: {fn: get_logs, args: {nf: gnb, last: 10}}, is_state_changing: false}
        - {id: b5_upf_logs, description: Read UPF logs (unexpected TEIDs), action: {fn: get_logs, args: {nf: upf, last: 10}}, is_state_changing: false}
        - id: b6_ipsec_n2
          description: Re-enable IPsec on N2 (restores the baseline; safe, idempotent)
          action: {fn: enable_ipsec, args: {interface: N2}}
          is_state_changing: true
          auto_safe: true
          source: TS 33.501 9.2 (ts_133501v181200p.pdf, p. 159)
        - id: b7_ipsec_n3
          description: Re-enable IPsec on N3 (restores the baseline; safe, idempotent)
          action: {fn: enable_ipsec, args: {interface: N3}}
          is_state_changing: true
          auto_safe: true
          source: TS 33.501 9.3 (ts_133501v181200p.pdf, p. 159)
      intermediate:
        - id: i1_up_integrity
          description: Require user-plane integrity protection on the gNB (renegotiates bearers)
          action: {fn: patch_config, args: {nf: gnb, key: up_integrity, value: required}}
          is_state_changing: true
          success_check: {fn: check_auth_config, path: up_integrity, op: "==", value: required}
        - {id: i2_verify, description: Re-check interfaces, action: {fn: check_interface_security, args: {}}, is_state_changing: false}
      advanced:
        - {id: a1_rotate_certs, description: Rotate NF certificates (keys may have been observed), action: {fn: rotate_keys, args: {scope: nf_certificates}}, is_state_changing: true}
        - {id: a2_restart_upf, description: Restart the UPF to drop hijacked tunnels, action: {fn: reset_nf, args: {nf: upf}}, is_state_changing: true}

  # ---------------------------------------------------------------------------
  - id: supply_chain_rogue_nf
    name: Rogue network function and subscriber data theft
    description: >-
      A compromised container (unapproved image) registers itself with the NRF
      as an SMF - the NRF accepts registrations without authentication. Now
      trusted, it queries the UDM for subscriber identities and profiles and
      slowly uploads them out. Difficulty: advanced - low and slow signals
      across several sources, and the response must happen in order, starting
      with a human decision: preserve evidence first or kill it now.
    affected_nf: [nrf, udm, upf]
    enisa_ref: >-
      ENISA 5G Threat Landscape (Update), "Malicious network functions" (p. 105),
      "Data breach, leak, theft and manipulation of information" (p. 106) and
      NRF vulnerabilities (pp. 72-73) (ENISA 5G Threat Landscape - Update.pdf)
    threegpp_ref: >-
      3GPP TS 33.501 clause 5.9.2.1 requirements for service registration,
      discovery and authorization - "The NRF shall act as authorization server"
      (ts_133501v181200p.pdf, pp. 39-40) and 13.4.1 OAuth 2.0 (p. 194)
    policy_tags:
      categories: [cyber_incident_rules, data_protection, law_and_acts]
      query: personal data breach by unauthorised access to the network, intimation and incident reporting
      obligations: [*certin_6h, *tcs_rule7, *cti_rules, *certin_logs, *dpdp_s8_6, *dpdp_rule7, *dpdp_commencement]
    retrieval_categories: [gpp_security, threat_frameworks, data_protection, cyber_incident_rules]
    resolved_when:
      - {fn: list_registered_nfs, path: unsigned, op: empty}
      - {fn: list_registered_nfs, path: registration_auth, op: "==", value: required}
      - {fn: get_metrics, args: {nf: udm}, path: bulk_reads_active, op: "==", value: 0}
      - {fn: get_egress_flows, path: active, op: empty}
      - {fn: get_egress_flows, path: isolated_instances, op: contains, value: nf-x9}
    playbook:
      basic:
        - {id: b1_alerts, description: Read the active alerts, action: {fn: get_alerts, args: {}}, is_state_changing: false}
        - {id: b2_registry, description: List NRF registrations - unsigned instances, unexpected hosts, authentication mode, action: {fn: list_registered_nfs, args: {}}, is_state_changing: false}
        - {id: b3_nrf_logs, description: Read NRF logs, action: {fn: get_logs, args: {nf: nrf, last: 10}}, is_state_changing: false}
        - {id: b4_udm_access, description: Who is reading subscriber data from the UDM, action: {fn: check_api_access_log, args: {nf: udm}}, is_state_changing: false}
        - {id: b5_udm_logs, description: Read UDM logs (query volume per consumer), action: {fn: get_logs, args: {nf: udm, last: 10}}, is_state_changing: false}
        - {id: b6_egress, description: Look for slow steady uploads from core hosts, action: {fn: get_egress_flows, args: {}}, is_state_changing: false}
      intermediate:
        - id: i1_preserve_evidence
          description: "DECISION - preserve evidence first? Approve = take a forensic snapshot before containment; decline = kill the rogue component immediately"
          action: {fn: capture_evidence, args: {target: {from: {fn: list_registered_nfs, path: unexpected_hosts.0}}}}
          is_state_changing: true
        - id: i2_deregister
          description: Deregister the rogue component from the NRF (its UDM queries stop)
          action: {fn: deregister_nf, args: {instance_id: {from: {fn: get_egress_flows, path: flows.0.src}}}}
          is_state_changing: true
          success_check: {fn: get_metrics, args: {nf: udm}, path: bulk_reads_active, op: "==", value: 0}
        - {id: i3_verify, description: Confirm the suspicious UDM queries stopped, action: {fn: check_api_access_log, args: {nf: udm}}, is_state_changing: false}
      advanced:
        - id: a1_isolate
          description: Network-isolate the rogue container
          action: {fn: isolate_instance, args: {instance_id: {from: {fn: get_egress_flows, path: flows.0.src}}}}
          is_state_changing: true
        - id: a2_cut_exfil
          description: Cut the exfiltration session
          action: {fn: cut_flow, args: {src: {from: {fn: get_egress_flows, path: flows.0.src}}}}
          is_state_changing: true
          success_check: {fn: get_egress_flows, path: active, op: empty}
        - id: a3_require_auth
          description: Turn on authentication for NF registration at the NRF
          action: {fn: patch_config, args: {nf: nrf, key: registration_auth, value: required}}
          is_state_changing: true
          source: TS 33.501 5.9.2.1 (ts_133501v181200p.pdf, pp. 39-40)
        - {id: a4_require_signed, description: Require signed NF profiles again, action: {fn: patch_config, args: {nf: nrf, key: require_signed_nf_profiles, value: true}}, is_state_changing: true}
        - {id: a5_verify, description: Verify the registry and that the queries stay stopped, action: {fn: list_registered_nfs, args: {}}, is_state_changing: false}

  # ---------------------------------------------------------------------------
  - id: subscriber_profile_tampering
    name: Subscriber profile tampering (slice breach)
    description: >-
      Someone logs into the core's admin panel with the default credentials and
      quietly edits one subscriber's profile so the device can join the
      protected hospital slice (urllc-hospital). At first this looks exactly
      like an operator's honest mistake. Difficulty: difficult - do not call it
      an attack before the admin login, the database change and the session
      line up.
    affected_nf: [oam, udm, smf]
    enisa_ref: >-
      ENISA 5G Threat Landscape (Update), "Manipulation of network
      configuration/data forging - CORE configuration data tampering"
      (pp. 103-104) and default accounts / weak passwords (p. 115)
      (ENISA 5G Threat Landscape - Update.pdf)
    threegpp_ref: >-
      3GPP TS 33.501 clause 16.2 Authorization for network slice access
      (ts_133501v181200p.pdf, pp. 215-216)
    policy_tags:
      categories: [cyber_incident_rules, law_and_acts]
      query: unauthorised access and modification of telecommunication network configuration incident reporting
      obligations: [*certin_6h, *tcs_rule7, *cti_rules, *certin_logs, *telecom_act_s22]
    retrieval_categories: [gpp_security, threat_frameworks, cyber_incident_rules]
    resolved_when:
      - {fn: check_slice_sessions, args: {slice: urllc-hospital}, path: not_on_allow_list, op: empty}
      - {fn: get_subscriber_changes, path: unreverted, op: empty}
      - {fn: check_mgmt_exposure, path: default_credentials, op: "==", value: false}
      - {fn: check_mgmt_exposure, path: admin_access, op: "==", value: jump-host-only}
    playbook:
      # Basic changes nothing on purpose: one edit could be an honest mistake,
      # so the agent first correlates the session, the change record and the login.
      basic:
        - {id: b1_alerts, description: Read the active alerts, action: {fn: get_alerts, args: {}}, is_state_changing: false}
        - {id: b2_slice_sessions, description: Sessions on the hospital slice that are not on its allow-list, action: {fn: check_slice_sessions, args: {slice: urllc-hospital}}, is_state_changing: false}
        - {id: b3_db_changes, description: Subscriber-database change records (who changed what, from where), action: {fn: get_subscriber_changes, args: {}}, is_state_changing: false}
        - {id: b4_admin_logins, description: Admin login log - was the change made from an unusual source, action: {fn: get_logs, args: {nf: oam, last: 10}}, is_state_changing: false}
        - {id: b5_mgmt, description: Are default admin credentials still in use, action: {fn: check_mgmt_exposure, args: {}}, is_state_changing: false}
        - {id: b6_smf_logs, description: When was the session established, action: {fn: get_logs, args: {nf: smf, last: 10}}, is_state_changing: false}
      intermediate:
        - id: i1_end_session
          description: End the session that is not on the slice allow-list
          action: {fn: end_session, args: {session_id: {from: {fn: check_slice_sessions, args: {slice: urllc-hospital}, path: not_on_allow_list.0.id}}}}
          is_state_changing: true
          success_check: {fn: check_slice_sessions, args: {slice: urllc-hospital}, path: not_on_allow_list, op: empty}
        - {id: i2_verify, description: Re-check the change records (the profile still allows the slice), action: {fn: get_subscriber_changes, args: {}}, is_state_changing: false}
      advanced:
        - id: a1_restore_profile
          description: Restore the edited profile from the known-good snapshot
          action: {fn: restore_profile, args: {supi: {from: {fn: get_subscriber_changes, path: unreverted.0.supi}}}}
          is_state_changing: true
          success_check: {fn: get_subscriber_changes, path: unreverted, op: empty}
        - id: a2_rotate_admin
          description: Rotate the admin credentials (remove the default account password)
          action: {fn: rotate_keys, args: {scope: oam_credentials}}
          is_state_changing: true
        - id: a3_restrict_admin
          description: Restrict admin access to the jump host
          action: {fn: restrict_admin_access, args: {}}
          is_state_changing: true
        - id: a4_verify
          description: Verify slice membership is back to the allow-list
          action: {fn: check_slice_sessions, args: {slice: urllc-hospital}}
          is_state_changing: false
          source: TS 33.501 16.2 (ts_133501v181200p.pdf, pp. 215-216)

  # ---------------------------------------------------------------------------
  - id: gtpu_spoofing_upf
    name: User-plane tunnel abuse (GTP-U spoofing)
    description: >-
      A device crafts packets inside its own GTP-U tunnel with a forged inner
      source address and sends them towards the management address range. The
      UPF does not check that the inner source matches the session's assigned
      address. Difficulty: medium - clear once you look at the right field.
    affected_nf: [upf]
    enisa_ref: >-
      ENISA 5G Threat Landscape (Update), "Identity fraud/account or service -
      IP spoofing" (pp. 106-107) and "Manipulation of network traffic ...
      Malicious diversion of traffic" (pp. 107-108)
      (ENISA 5G Threat Landscape - Update.pdf)
    threegpp_ref: >-
      3GPP TS 33.501 clause 9.3 Security mechanisms for the N3 interface
      (ts_133501v181200p.pdf, p. 159)
    policy_tags:
      categories: [cyber_incident_rules, law_and_acts]
      query: unauthorised access to network systems through user traffic, incident reporting
      obligations: [*certin_6h, *tcs_rule7, *cti_rules, *certin_logs]
    retrieval_categories: [gpp_security, gpp_architecture, threat_frameworks, cyber_incident_rules]
    resolved_when:
      - {fn: get_upf_flows, path: source_address_validation, op: "==", value: enabled}
      - {fn: get_upf_flows, path: spoofed, op: empty}
      - {fn: get_upf_flows, path: to_internal_ranges, op: empty}
      - {fn: get_upf_flows, path: acl_blocks, op: contains, value: 10.45.0.0/16->10.10.0.0/16}
      - {fn: check_slice_sessions, args: {slice: embb}, path: session_ids, op: not_contains, value: pdu-5001}
    playbook:
      basic:
        - {id: b1_alerts, description: Read the active alerts, action: {fn: get_alerts, args: {}}, is_state_changing: false}
        - {id: b2_upf_flows, description: Compare each flow's inner source with the session's assigned address, action: {fn: get_upf_flows, args: {}}, is_state_changing: false}
        - {id: b3_upf_logs, description: Read UPF logs, action: {fn: get_logs, args: {nf: upf, last: 10}}, is_state_changing: false}
        - {id: b4_sessions, description: Find the session and subscriber behind the flow, action: {fn: check_slice_sessions, args: {slice: embb}}, is_state_changing: false}
        - {id: b5_metrics, description: UPF load, action: {fn: get_metrics, args: {nf: upf}}, is_state_changing: false}
        - id: b6_sav
          description: Enable source-address validation on the UPF (restores the baseline; safe, idempotent)
          action: {fn: patch_config, args: {nf: upf, key: source_address_validation, value: enabled}}
          is_state_changing: true
          auto_safe: true
          success_check: {fn: get_upf_flows, path: spoofed, op: empty}
      intermediate:
        - id: i1_block_route
          description: Block the device address range from reaching the internal management range
          action: {fn: block_route, args: {src_range: {from: {fn: get_upf_flows, path: flows.0.src_range}}, dst_range: {from: {fn: get_upf_flows, path: flows.0.dst_range}}}}
          is_state_changing: true
        - id: i2_end_session
          description: Drop the offending session
          action: {fn: end_session, args: {session_id: {from: {fn: get_upf_flows, path: flows.0.session}}}}
          is_state_changing: true
        - id: i3_verify
          description: Confirm the spoofed traffic stopped
          action: {fn: get_upf_flows, args: {}}
          is_state_changing: false
          success_check: {fn: get_upf_flows, path: to_internal_ranges, op: empty}
      advanced:
        - {id: a1_rotate_oam, description: Rotate OAM credentials (the management range was targeted), action: {fn: rotate_keys, args: {scope: oam_credentials}}, is_state_changing: true}
        - {id: a2_oam_logs, description: Check OAM logs for logins from the device range, action: {fn: get_logs, args: {nf: oam, last: 10}}, is_state_changing: false}

  # ---------------------------------------------------------------------------
  - id: iot_botnet_mmtc
    name: IoT botnet inside the massive-IoT slice
    description: >-
      Cheap smart meters on the mmtc slice, infected through default
      passwords, are told by a command server to flood the hospital's patient
      portal on the urllc-hospital slice. The attack starts in one slice and
      hurts another. Difficulty: medium-advanced - many sources, two slices,
      and infected devices must be separated from healthy ones.
    affected_nf: [upf, amf]
    enisa_ref: >-
      ENISA 5G Threat Landscape (Update), "Malicious code/software - Botnet"
      (pp. 104-105), "Distributed denial of service (DDoS)" (p. 104) and
      default accounts (p. 115) (ENISA 5G Threat Landscape - Update.pdf)
    threegpp_ref: >-
      3GPP TS 33.501 clause 16 security procedures for network slices
      (ts_133501v181200p.pdf, pp. 215-216); TS 23.501 5.19 overload control
      (ts_123501v190800p.pdf, p. 359)
    policy_tags:
      categories: [cyber_incident_rules, law_and_acts]
      query: attacks on IoT devices and denial of service, incident reporting
      obligations: [*certin_6h, *tcs_rule7, *cti_rules, *certin_logs, *telecom_act_s22]
    retrieval_categories: [gpp_security, gpp_architecture, threat_frameworks, cyber_incident_rules]
    resolved_when:
      - {fn: get_service_health, args: {service: hospital-portal}, path: status, op: "==", value: ok}
      - {fn: get_flow_logs, path: unblocked_c2, op: empty}
      - {fn: get_device_stats, args: {slice: mmtc}, path: anomalous, op: empty}
      - {fn: get_device_stats, args: {slice: mmtc}, path: healthy_quarantined, op: "==", value: 0}
    playbook:
      basic:
        - {id: b1_alerts, description: Read the active alerts, action: {fn: get_alerts, args: {}}, is_state_changing: false}
        - {id: b2_target, description: Health of the target service, action: {fn: get_service_health, args: {service: hospital-portal}}, is_state_changing: false}
        - {id: b3_devices, description: Per-device traffic on the mmtc slice - which devices changed behaviour, action: {fn: get_device_stats, args: {slice: mmtc}}, is_state_changing: false}
        - {id: b4_flow_logs, description: Earlier connections from those devices - a common command server, action: {fn: get_flow_logs, args: {}}, is_state_changing: false}
        - {id: b5_upf_logs, description: Read UPF logs, action: {fn: get_logs, args: {nf: upf, last: 10}}, is_state_changing: false}
        - id: b6_slice_limit
          description: Per-device rate limit of 20 on the mmtc slice (healthy meters send 1; safe, idempotent)
          action: {fn: rate_limit_slice, args: {slice: mmtc, per_device: 20}}
          is_state_changing: true
          auto_safe: true
          success_check: {fn: get_service_health, args: {service: hospital-portal}, path: status, op: "==", value: ok}
      intermediate:
        - id: i1_filter
          description: Protect the hospital portal with traffic filtering
          action: {fn: enable_traffic_filter, args: {service: hospital-portal}}
          is_state_changing: true
        - id: i2_block_c2
          description: Block the command server the infected devices contacted
          action: {fn: block_destination, args: {address: {from: {fn: get_flow_logs, path: c2_candidates.0}}}}
          is_state_changing: true
          success_check: {fn: get_flow_logs, path: new_devices_contacting_c2, op: "==", value: 0}
        - {id: i3_verify, description: Check no new devices join the flood, action: {fn: get_flow_logs, args: {}}, is_state_changing: false}
      advanced:
        - id: a1_quarantine
          description: Quarantine ONLY the devices with anomalous traffic (healthy meters stay in service)
          action: {fn: quarantine_devices, args: {devices: {from: {fn: get_device_stats, args: {slice: mmtc}, path: anomalous}}}}
          is_state_changing: true
          success_check: {fn: get_device_stats, args: {slice: mmtc}, path: healthy_quarantined, op: "==", value: 0}
        - {id: a2_verify_devices, description: Verify no anomalous devices remain, action: {fn: get_device_stats, args: {slice: mmtc}}, is_state_changing: false}
        - {id: a3_verify_target, description: Verify the target recovered, action: {fn: get_service_health, args: {service: hospital-portal}}, is_state_changing: false}
